[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "postgres: PostgreSQL concurrent integration",
    "integration: requires a configured external database or backup/restore services",
    "recovery: restore environment validation",
]
[tool.ruff]
line-length = 110
target-version = "py313"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
