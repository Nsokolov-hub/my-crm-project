name: CI

on:
  push:
    branches: [main]
  # Every pull request is checked, including stacked ones whose base is another branch.
  pull_request:

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r backend/requirements.lock
      - name: Audit dependencies
        run: pip-audit -r backend/requirements.lock
      - name: Check code style
        run: ruff check backend
      - name: Check that docs/openapi.json matches the code
        run: python3 scripts/export_openapi.py --check
      - name: Run backend SQLite tests
        env:
          DATABASE_URL: sqlite://
        run: PYTHONPATH=backend pytest backend/tests -m 'not postgres and not integration' -q -p no:cacheprovider --junitxml=backend-sqlite-report.xml
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-sqlite-report
          path: backend-sqlite-report.xml

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version as docker-compose.yml.
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: crm_test
          POSTGRES_PASSWORD: crm_test_password
          POSTGRES_DB: crm_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://crm_test:crm_test_password@localhost:5432/crm_test_db
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r backend/requirements.lock
      - name: Run Alembic migrations
        run: alembic -c backend/alembic.ini upgrade head
      - name: Check that models and migrations agree
        run: alembic -c backend/alembic.ini check
      - name: Run backend PostgreSQL tests
        # pytest exits with 5 when nothing is collected, so a missing postgres marker fails the job.
        run: pytest backend/tests -m 'postgres' -q -p no:cacheprovider --junitxml=backend-postgres-report.xml
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-postgres-report
          path: backend-postgres-report.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Same major version as frontend/Dockerfile.
          node-version: '24'
      - name: Install pnpm
        run: npm install -g pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod
      - name: Audit development tooling (informational)
        run: pnpm audit || true
      - name: Check TypeScript
        run: pnpm run typecheck
      - name: Check ESLint
        run: pnpm exec eslint src
      - name: Check Stylelint
        run: pnpm exec stylelint "src/**/*.scss"
      - name: Run frontend tests
        env:
          TZ: Europe/Moscow
        run: pnpm exec vitest run --reporter=junit --outputFile=frontend-report.xml
      - name: Build frontend
        run: pnpm run build
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-report
          path: frontend/frontend-report.xml
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t reaktiv-crm-backend:ci backend
      - name: Smoke-test backend image
        run: docker run --rm -e DATABASE_URL=sqlite:// reaktiv-crm-backend:ci python -c "import app.main, app.communication.worker"
      - name: Build web image
        run: docker build -t reaktiv-crm-web:ci frontend
      - name: Validate nginx configuration
        run: docker run --rm --add-host api:127.0.0.1 --entrypoint nginx reaktiv-crm-web:ci -t
