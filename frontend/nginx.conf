worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Re-resolve the API address after a container replacement.
    resolver 127.0.0.11 valid=30s ipv6=off;
    upstream crm_api {
        zone crm_api 64k;
        server api:8000 resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # 25 MiB upload plus multipart framing. Keep aligned with MAX_FILE_SIZE.
        client_max_body_size 26m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location = /ready { proxy_pass http://crm_api; }
        location = /health { proxy_pass http://crm_api; }
        location = /openapi.json { proxy_pass http://crm_api; }
        location /api/ { proxy_pass http://crm_api; }
        location = /metrics { return 404; }
        location ~ /\. { deny all; }

        location / {
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
            try_files $uri $uri/ /index.html;
        }
    }
}
