[project]
name = "reaktiv-crm-backend"
version = "0.1.0"
description = "API, фоновый worker и миграции Реактив CRM"
requires-python = ">=3.13"
# Direct runtime dependencies. requirements.lock pins them with everything they pull in and is what
# the Docker image installs; after any change here run python3 scripts/lock_backend.py.
dependencies = [
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "cryptography>=50.0",
    # openpyxl parses uploaded workbooks with defusedxml when it is installed.
    "defusedxml>=0.7.1",
    "email-validator>=2.3",
    "fastapi>=0.141.1",
    # Signed events for the site (flow F2) are sent by the worker over HTTP.
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "prometheus-client>=0.26",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyotp>=2.10",
    "python-multipart>=0.0.32",
    "reportlab>=4.5",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52",
]

[dependency-groups]
# Tests, linters and audit; pinned in requirements-dev.lock together with the runtime set.
dev = [
    "mypy>=1.20",
    "pip-audit>=2.10",
    "pytest>=9.0.3",
    "pytest-cov>=6.3",
    "ruff>=0.16.7",
    # Resolves the lock files: scripts/lock_backend.py.
    "uv>=0.11.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "postgres: PostgreSQL concurrent integration",
    "integration: requires a configured external database or backup/restore services",
    "recovery: restore environment validation",
]
[tool.ruff]
line-length = 110
target-version = "py313"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

# Modules that still had type errors when CI started checking types (375 in total). Every other
# module must pass; take a module off the list once it does, and do not add new ones.
[[tool.mypy.overrides]]
module = [
    "app.analytics.routes",
    "app.business.absences",
    "app.business.calendar",
    "app.business.cashflow",
    "app.business.reports",
    "app.business.supplier_mail",
    "app.business.supplier_orders",
    "app.commerce.calculator",
    "app.commerce.documents",
    "app.commerce.financial",
    "app.commerce.fulfillment",
    "app.commerce.payments",
    "app.commerce.procurement",
    "app.commerce.schemas",
    "app.communication.access",
    "app.communication.routes",
    "app.crm.activities",
    "app.crm.catalogue",
    "app.crm.counterparties",
    "app.crm.imports",
    "app.crm.quotes",
    "app.crm.requests",
    "app.crm.schemas",
    "app.crm.table_imports",
]
ignore_errors = true
