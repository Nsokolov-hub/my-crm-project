services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?Set CRM_DOMAIN in .env}
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
volumes:
  caddy-data:
  caddy-config:
